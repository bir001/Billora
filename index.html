<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#ffffff"><title>Billora — POS Billing & Inventory</title>
<meta name="description" content="Fast touch POS billing, inventory, returns, KOT and thermal printing."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Billora">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('billora_theme')||'royal'}catch(e){}</script>
<style>#splash{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:#fff;color:#1b1340;font-family:system-ui,sans-serif;overflow:hidden;transition:opacity .6s,visibility .6s}#splash.hide{opacity:0;visibility:hidden}
#splash .bg{position:absolute;inset:-20%;background:radial-gradient(40% 35% at 20% 20%,#efe5ff 0,transparent 70%),radial-gradient(45% 40% at 85% 80%,#ffe3f1 0,transparent 70%),radial-gradient(35% 30% at 80% 15%,#e2ecff 0,transparent 70%);animation:bgm 7s ease-in-out infinite alternate}
#splash .in{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
#splash .lg{position:relative;width:170px;height:170px;display:grid;place-items:center}#splash .lg img{width:132px;height:132px;object-fit:contain;animation:pop .9s cubic-bezier(.2,1.3,.4,1) both,fl 3.2s ease-in-out .9s infinite;filter:drop-shadow(0 14px 22px rgba(109,40,217,.28))}
#splash .lg i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(124,58,237,.35);animation:rg 2.2s ease-out infinite}#splash .lg i:nth-child(2){animation-delay:.7s}#splash .lg i:nth-child(3){animation-delay:1.4s}
#splash b{font-size:30px;letter-spacing:.5px;animation:up .8s .35s both}#splash b em{font-style:normal;color:#7C3AED}#splash small{color:#7a7396;letter-spacing:.12em;text-transform:uppercase;font-size:11.5px;animation:up .8s .55s both}
#splash .bar{width:170px;height:4px;border-radius:9px;background:#ece6fb;overflow:hidden;margin-top:10px;animation:up .8s .7s both}#splash .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,#B04CFF,#6D28D9,#B04CFF);border-radius:9px;animation:ld 1.15s ease-in-out infinite}
#splash .ft{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#a79fc4;font-size:12px;letter-spacing:.04em}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes rg{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.25);opacity:0}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}@keyframes ld{0%{transform:translateX(-110%)}100%{transform:translateX(380%)}}@keyframes bgm{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(1.5%,-1.5%)}}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pos.css"></head><body>
<div id="splash"><div class="bg"></div><div class="in"><div class="lg"><i></i><i></i><i></i><img src="logo.png" alt="Billora"></div><b>bill<em>ora</em></b><small>Fast billing · Smart inventory</small><div class="bar"><i></i></div></div><div class="ft">Made for modern shops</div></div>
<header><button class="ib" id="hmenu" onclick="openDrawer()" aria-label="Menu"></button><a class="logo" href="#home"><img class="lg-img" src="logo-sm.png" alt="Billora"><i class="wm">bill<span>ora</span></i></a><div class="hr"><button class="ib btb" id="hbt" onclick="btClick()" aria-label="Printer"></button><button class="ib" id="hset" onclick="go('account')" aria-label="Account"></button></div></header>
