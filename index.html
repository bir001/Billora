<style>#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--hero,linear-gradient(135deg,#061552,#0B3BD6 58%,#2C6BFF));color:#fff;font-family:system-ui,sans-serif;transition:opacity .5s,visibility .5s}#splash.hide{opacity:0;visibility:hidden}

#splash b{font-size:26px;letter-spacing:.5px}#splash small{opacity:.75;margin-top:-12px}#splash .bar{width:150px;height:4px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}#splash .bar i{display:block;height:100%;width:40%;background:#fff;border-radius:9px;animation:ld 1.1s ease-in-out infinite}
