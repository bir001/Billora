<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EEF3FF"><title>Billora — Billing & Business</title><meta name="description" content="A simple business billing and invoice management app."><script>try{document.documentElement.dataset.theme=localStorage.getItem('billora_theme')||'royal'}catch(e){}</script><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
.logo-mark{width:35px;height:35px;border-radius:12px;background:var(--grad);color:white;display:grid;place-items:center;font:800 17px Sora}.logo img{display:none}.logo span{color:var(--b)}main{max-width:980px;padding-bottom:26px}.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0 18px}.pagehead h1{font-size:clamp(23px,5vw,30px)}.pagehead p{font-size:13px;color:var(--mut)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:16px;border-radius:21px;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--sh)}.stat small{color:var(--mut);font-size:12px}.stat strong{display:block;font:700 23px Sora;margin:6px 0 2px}.stat .trend{font-size:11px;color:var(--ok)}.stat .ico{float:right;width:36px;height:36px;border-radius:12px;background:var(--bg2);display:grid;place-items:center}.panel{padding:18px;margin:16px 0}.panel h3{font-size:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--mut)}.table-wrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:560px;font-size:13px}.tbl th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:12px 10px;border-bottom:1px solid var(--ln)}.tbl td{padding:13px 10px;border-bottom:1px solid var(--ln)}.pill{display:inline-flex;padding:5px 9px;border-radius:99px;background:var(--bg2);font-size:11px;font-weight:700}.pill.paid{background:#dcf7e8;color:#137b43}.pill.unpaid{background:#fff0d4;color:#986000}.pill.overdue{background:#ffe1e1;color:#a12b2b}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.quick button{padding:15px;border-radius:18px;border:1px solid var(--ln);background:var(--sf);text-align:left;font-weight:700;box-shadow:var(--sh)}.quick span{display:block;color:var(--mut);font-size:12px;font-weight:500;margin-top:4px}.quick b{font-size:21px;display:block;margin-bottom:5px;color:var(--b)}.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.fieldgrid .full{grid-column:1/-1}.formlabel{font-size:12px;font-weight:700;color:var(--mut);display:block;margin:4px 0 6px}.actions{display:flex;gap:8px;flex-wrap:wrap}.iconbtn{padding:8px 10px;border:1px solid var(--ln);border-radius:11px;background:var(--sf);font-size:12px}.emptybox{text-align:center;padding:30px 12px;color:var(--mut)}.emptybox b{display:block;color:var(--ink);margin-bottom:4px}.search{max-width:260px;margin:0}.navlabel{font-size:10px}.chart{display:flex;align-items:end;gap:9px;height:145px;padding:16px 4px 0}.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:end}.barcol i{display:block;width:100%;max-width:34px;background:var(--grad);border-radius:9px 9px 3px 3px;min-height:4px}.barcol small{font-size:10px;color:var(--mut)}.sheet-actions{display:flex;gap:8px}.danger{color:#c33}.invoice-paper{background:#fff;color:#17213a;padding:22px;border-radius:16px;max-width:650px;margin:10px auto;font-family:Arial,sans-serif}.invoice-paper h2{font-size:24px}.invoice-paper table{width:100%;border-collapse:collapse;margin:18px 0}.invoice-paper td,.invoice-paper th{padding:9px;border-bottom:1px solid #e8eaf0;text-align:left;font-size:13px}.invoice-paper .right{text-align:right}.invoice-paper .total{font-size:18px;font-weight:bold}.settings-row{padding:14px 0;border-bottom:1px solid var(--ln)}.settings-row:last-child{border:0}.hide{display:none!important}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}.quick{grid-template-columns:repeat(4,1fr)}}@media(max-width:480px){.fieldgrid{grid-template-columns:1fr}.fieldgrid .full{grid-column:auto}.pagehead{align-items:flex-start;flex-direction:column}.pagehead .btn{width:100%}.search{max-width:100%}}
</style></head><body><header><button class="ib" onclick="openDrawer()" aria-label="Open menu">☰</button><a class="logo" href="#home"><span class="logo-mark">B</span><i class="wm">bill<span>ora</span></i></a><div class="hr"><button class="ib" onclick="toggleTheme()" aria-label="Change theme">◐</button><button class="ib" onclick="navigate('settings')" aria-label="Settings">⚙</button></div></header><main id="app"></main><footer id="foot"></footer><nav id="nav"></nav><div class="ov" id="ov" onclick="closeAll()"></div><aside id="drawer"></aside><div id="sheet"><div class="grab"></div><div id="sheet-body"></div></div><div id="toast"></div><script src="app.js"></script></body></html>
