<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#EEF3FF">
<title>Billora — Fast Touch Billing</title>
<meta name="description" content="Fast touch billing, inventory, KOT & thermal print ready POS">
<script>
try {
  document.documentElement.dataset.theme = localStorage.getItem('billora_theme') || 'royal';
} catch(e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ===== Billora POS extras ===== */
.logo-mark{width:35px;height:35px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font:800 17px Sora}
.logo img{display:none}.logo span{color:var(--b)}
main{max-width:1100px;padding-bottom:28px}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 16px;flex-wrap:wrap}
.pagehead h1{font-size:clamp(22px,5vw,28px)}.pagehead p{font-size:13px;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:15px;border-radius:20px;background:var(--sf);border:1px solid var(--ln);box-shadow:var(--sh)}
.stat small{color:var(--mut);font-size:12px}.stat strong{display:block;font:700 22px Sora;margin:5px 0 2px}
.stat .trend{font-size:11px;color:var(--ok)}.stat .ico{float:right;width:34px;height:34px;border-radius:12px;background:var(--bg2);display:grid;place-items:center}
.panel{padding:16px;margin:14px 0}.panel h3{font-size:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--mut)}
.table-wrap{overflow:auto}
.tbl{width:100%;border-collapse:collapse;min-width:520px;font-size:13px}
.tbl th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:11px 9px;border-bottom:1px solid var(--ln)}
.tbl td{padding:12px 9px;border-bottom:1px solid var(--ln)}
.pill{display:inline-flex;padding:4px 9px;border-radius:99px;background:var(--bg2);font-size:11px;font-weight:700}
.pill.paid{background:#dcf7e8;color:#137b43}.pill.unpaid{background:#fff0d4;color:#986000}
.pill.overdue{background:#ffe1e1;color:#a12b2b}.pill.partial{background:#e8f0ff;color:#1F5BFF}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.quick button{padding:14px;border-radius:18px;border:1px solid var(--ln);background:var(--sf);text-align:left;font-weight:700;box-shadow:var(--sh)}
.quick span{display:block;color:var(--mut);font-size:12px;font-weight:500;margin-top:3px}
.quick b{font-size:20px;display:block;margin-bottom:4px;color:var(--b)}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fieldgrid .full{grid-column:1/-1}
.formlabel{font-size:12px;font-weight:700;color:var(--mut);display:block;margin:4px 0 6px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.iconbtn{padding:8px 11px;border:1px solid var(--ln);border-radius:11px;background:var(--sf);font-size:12px;font-weight:600}
.emptybox{text-align:center;padding:28px 12px;color:var(--mut)}.emptybox b{display:block;color:var(--ink);margin-bottom:4px}
.search{max-width:280px;margin:0}
.chart{display:flex;align-items:end;gap:8px;height:140px;padding:14px 4px 0}
.barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:end}
.barcol i{display:block;width:100%;max-width:32px;background:var(--grad);border-radius:8px 8px 3px 3px;min-height:4px}
.barcol small{font-size:10px;color:var(--mut)}
.danger{color:#c33}
.hide{display:none!important}
.settings-row{padding:13px 0;border-bottom:1px solid var(--ln)}.settings-row:last-child{border:0}

/* ===== POS Billing Layout ===== */
.pos-wrap{display:grid;grid-template-columns:1fr 340px;gap:14px;min-height:calc(100vh - 180px)}
@media(max-width:860px){.pos-wrap{grid-template-columns:1fr}}
.pos-left{display:flex;flex-direction:column;gap:10px}
.pos-right{position:sticky;top:70px;align-self:start}
.cat-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-btn{flex:none;padding:10px 16px;border-radius:999px;border:1.5px solid var(--ln);background:var(--sf);font-weight:700;font-size:13px;white-space:nowrap}
.cat-btn.on{background:var(--grad);color:#fff;border-color:transparent}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item-card{background:var(--sf);border:1.5px solid var(--ln);border-radius:18px;padding:12px 10px;text-align:center;cursor:pointer;transition:transform .12s,box-shadow .15s;user-select:none;-webkit-user-select:none}
.item-card:active{transform:scale(.96)}
.item-card:hover{box-shadow:var(--sh2)}
.item-card .ic{width:48px;height:48px;border-radius:14px;background:var(--bg2);margin:0 auto 8px;display:grid;place-items:center;font:800 18px Sora;color:var(--b)}
.item-card h4{font-size:13px;line-height:1.25;margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.item-card .pr{font:700 14px Sora;color:var(--b)}
.item-card .stk{font-size:10px;color:var(--mut);margin-top:2px}
.item-card.oos{opacity:.45;pointer-events:none}
.cart-box{background:var(--sf);border:1px solid var(--ln);border-radius:22px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
.cart-head{padding:14px 16px;background:var(--hero);color:#fff}
.cart-head h3{font-size:16px;margin:0}
.cart-body{flex:1;overflow-y:auto;padding:10px 12px;max-height:320px}
.cart-line{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.cart-line:last-child{border:0}
.cart-line .name{flex:1;min-width:0;font-size:13px;font-weight:600}
.cart-line .name small{display:block;font-weight:500;color:var(--mut);font-size:11px}
.qty-ctrl{display:flex;align-items:center;gap:6px;background:var(--bg2);border-radius:999px;padding:3px}
.qty-ctrl button{width:28px;height:28px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-weight:800}
.qty-ctrl span{min-width:18px;text-align:center;font-weight:700;font-size:13px}
.cart-foot{padding:12px 14px 16px;border-top:1px solid var(--ln);background:var(--sf2)}
.cart-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--mut)}
.cart-row b{color:var(--ink)}.cart-row.grand{font-size:18px;font-weight:800;color:var(--ink);padding-top:8px;margin-top:6px;border-top:1px dashed var(--ln)}
.cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cart-actions .btn{padding:12px 8px;font-size:13px}
.barcode-row{display:flex;gap:8px;align-items:center}
.barcode-row input{margin:0;flex:1}
.barcode-row .btn{padding:12px 14px;flex:none}
.bill-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.bill-meta select,.bill-meta input{margin:0;padding:10px 12px;font-size:13px}

/* Thermal / Print paper */
.invoice-paper{background:#fff;color:#111;padding:18px;border-radius:12px;max-width:680px;margin:8px auto;font-family:'Courier New',Courier,monospace;font-size:13px}
.invoice-paper.thermal58{max-width:280px;font-size:12px;padding:10px}
.invoice-paper.thermal80{max-width:360px;font-size:12.5px;padding:12px}
.invoice-paper h2{font-size:18px;text-align:center;margin:0 0 4px}
.invoice-paper .center{text-align:center}
.invoice-paper .right{text-align:right}
.invoice-paper table{width:100%;border-collapse:collapse;margin:10px 0}
.invoice-paper td,.invoice-paper th{padding:4px 2px;border-bottom:1px dashed #ccc;font-size:12px}
.invoice-paper .total{font-size:15px;font-weight:bold}
.invoice-paper .sep{border:0;border-top:1px dashed #999;margin:8px 0}
.kot-paper{background:#fff;color:#111;padding:14px;font-family:'Courier New',monospace;max-width:280px;margin:auto;font-size:13px}
.kot-paper h3{text-align:center;margin:0 0 6px}

/* Login overlay */
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--sf);border:1px solid var(--ln);border-radius:28px;padding:28px 24px;width:100%;max-width:380px;box-shadow:var(--sh2);text-align:center}
.login-card h2{margin:8px 0 4px}
.pin-dots{display:flex;gap:10px;justify-content:center;margin:18px 0}
.pin-dots i{width:14px;height:14px;border-radius:50%;background:var(--ln)}
.pin-dots i.on{background:var(--b)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto}
.numpad button{height:54px;border-radius:16px;background:var(--bg2);font:700 20px Sora;border:1px solid var(--ln)}
.numpad button:active{background:var(--b);color:#fff}

@media(min-width:640px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .quick{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:480px){
  .fieldgrid{grid-template-columns:1fr}
  .fieldgrid .full{grid-column:auto}
  .pagehead{align-items:flex-start;flex-direction:column}
  .pagehead .btn{width:100%}
  .search{max-width:100%}
  .item-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media print{
  body *{visibility:hidden}
  #printarea,.invoice-paper,.kot-paper,#printarea *{visibility:visible}
  #printarea{position:absolute;left:0;top:0;width:100%}
  nav,header,#foot,#drawer,#ov,#sheet,.cart-actions{display:none!important}
}
</style>
</head>
<body>
<header>
  <button class="ib" onclick="openDrawer()" aria-label="Menu">☰</button>
  <a class="logo" href="#home" onclick="navigate('home');return false">
    <span class="logo-mark">B</span>
    <i class="wm">bill<span>ora</span></i>
  </a>
  <div class="hr">
    <button class="ib" onclick="toggleTheme()" aria-label="Theme">◐</button>
    <button class="ib" onclick="navigate('settings')" aria-label="Settings">⚙</button>
  </div>
</header>

<main id="app"></main>
<footer id="foot"></footer>
<nav id="nav"></nav>

<div class="ov" id="ov" onclick="closeAll()"></div>
<aside id="drawer"></aside>
<div id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
<div id="toast"></div>

<!-- Login screen -->
<div id="loginScreen" class="login-screen hide">
  <div class="login-card">
    <div class="logo-mark" style="margin:0 auto 8px;width:52px;height:52px;font-size:24px">B</div>
    <h2>Billora</h2>
    <p class="muted" id="loginUserHint">Select user & enter PIN</p>
    <div id="userSelect" style="margin:14px 0"></div>
    <div class="pin-dots" id="pinDots"><i></i><i></i><i></i><i></i></div>
    <div class="numpad" id="numpad"></div>
    <p class="muted" style="font-size:12px;margin-top:16px">Demo PIN: 1234 (all users)</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
